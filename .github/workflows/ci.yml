name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q examples scripts tests
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate strategy guards
        shell: bash
        run: |
          python scripts/validate_qmt_strategy.py examples/qmt_etf_rotation_live.py
          python scripts/validate_qmt_strategy.py examples/qmt_multifactor_live.py
